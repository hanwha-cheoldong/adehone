name: Bug report
description: Report a problem with Adehone
title: '[Bug]: '
type: Bug
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for Adehone bugs. Include enough detail for someone else to reproduce the issue.

  - type: dropdown
    id: where
    attributes:
      label: Where were you using Adehone?
      description: Where you saw the bug.
      options:
        - Desktop only
        - Desktop + SSH host
        - Desktop + Adehone server
        - Desktop + WSL
        - Mobile app
        - Web browser
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: 'The device you were using. WSL: pick Windows. Phone: pick iOS or Android.'
      options:
        - macOS
        - Windows
        - Linux
        - iOS
        - Android
        - Other
    validations:
      required: true

  - type: dropdown
    id: remote_os
    attributes:
      label: Remote host operating system
      description: Only for SSH, Adehone server or web.
      options:
        - Linux
        - macOS
        - Windows
        - Other
        - Not sure
    validations:
      required: false

  - type: input
    id: Adehone_version
    attributes:
      label: Adehone version
      description: 'macOS: Adehone > About Adehone. Windows/Linux: Help > About Adehone. Mobile: Settings > About.'
      placeholder: v1.4.2
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the bug in your own words. Include a short summary, reproduction steps, and anything else that seems relevant.
      placeholder: |
        Short summary:
        Adehone crashes when ...

        What happened?

        How can we reproduce it?
        1. ...
        2. ...
        3. ...

        Anything else that might help:
    validations:
      required: true
